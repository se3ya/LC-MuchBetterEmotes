[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "seechela"
name = "MuchBetterEmotes"
description = "More emotes and a sign you can draw on, rebuilt for v81."
websiteUrl = "https://github.com/se3ya/LC-MuchBetterEmotes"
containsNswContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
xilophor-LethalNetworkAPI = "3.4.2"
Rune580-LethalCompany_InputUtils = "0.7.13"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "../Plugin/MuchBetterEmotes/bin/Release/netstandard2.1/MuchBetterEmotes.dll"
target = "BepInEx/plugins/MuchBetterEmotes/MuchBetterEmotes.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../assets/muchbetteremotes"
target = "BepInEx/plugins/MuchBetterEmotes/muchbetteremotes"
